  <title id="title">The n=60 four-supporting-line configuration</title>
  <desc id="desc">All 60 points and all 129 certified four-point lines, spread out by an exact projective transformation followed by an affine rescaling. The four point families have sizes 13, 13, 17, and 17.</desc>
